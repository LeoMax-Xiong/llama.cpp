<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3 计算流程可视化 - llama.cpp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>计算图与推理流程可视化<span class="sub">llama.cpp</span></h1>
  <span class="model-badge" id="model-badge"><span class="dot"></span>Qwen3-0.6B · 28 层 · GQA 16/8</span>
  <nav class="stage-nav" id="tabs"></nav>
</header>

<main>
  <!-- 左：说明与概念 -->
  <section class="panel">
    <h2>本阶段步骤<span id="stage-sub" style="float:right;text-transform:none;color:var(--text-faint)"></span></h2>
    <ul class="step-list" id="steps"></ul>
    <div id="load-model-slot"></div>
    <h2>关键概念</h2>
    <div id="concepts"></div>
    <h2>当前步骤</h2>
    <p class="step-title" id="step-title"></p>
    <p class="step-desc" id="step-desc"></p>
  </section>

  <!-- 中：可视化舞台 -->
  <section class="stage">
    <div class="stage-head" id="stage-head"></div>
    <div class="viz" id="viz"></div>
  </section>

  <!-- 右：日志与参数 -->
  <aside class="panel">
    <h2>运行日志（模拟）</h2>
    <pre class="log" id="log"></pre>
    <h2 style="margin-top:20px">模型参数</h2>
    <div class="params" id="params"></div>
    <p class="step-desc" style="margin-top:14px;font-size:11.5px">
      <b style="color:var(--green)">实测值</b>：加载模型后，架构参数与文件头字段取自所选 GGUF 文件。<br>
      <b style="color:var(--yellow)">示意值</b>：日志文本、buffer 大小、split 划分、采样概率等为教学示意，不代表真实运行输出。
    </p>
  </aside>
</main>

<footer>
  <button class="btn" id="btn-prev">上一步</button>
  <button class="btn primary" id="btn-next">下一步</button>
  <button class="btn" id="btn-play">自动播放</button>
  <button class="btn" id="btn-reset">重置</button>
  <div class="progress-wrap"><div class="progress" id="progress"></div></div>
  <span class="status" id="status"></span>
</footer>

<!-- 隐藏的模型文件选择框，由左侧“加载模型”按钮触发 -->
<input type="file" id="model-file" accept=".gguf" style="display:none">

<script src="gguf.js"></script>
<script src="app.js"></script>
</body>
</html>
